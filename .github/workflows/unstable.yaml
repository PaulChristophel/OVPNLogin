name: Build and publish unstable OpenVPN images

on:
  push:
    branches:
      - master
    paths:
      - "**/*.go"
      - ".github/workflows/unstable.yaml"
      - "Dockerfile"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - "images.json"
      - "net.sh"
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Load build configuration
    runs-on: ubuntu-latest
    outputs:
      configuration: ${{ steps.matrix.outputs.configuration }}
      variants: ${{ steps.matrix.outputs.variants }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read image configuration
        id: matrix
        run: |
          echo "configuration=$(jq -c '{image, openvpn, build}' images.json)" >> "$GITHUB_OUTPUT"
          echo "variants=$(jq -c '.variants' images.json)" >> "$GITHUB_OUTPUT"

  build:
    name: OpenVPN ${{ fromJSON(needs.prepare.outputs.configuration).openvpn.version }} ${{ matrix.variant.name }}
    needs: prepare
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ fromJSON(needs.prepare.outputs.configuration).image }}
      OPENVPN_VERSION: ${{ fromJSON(needs.prepare.outputs.configuration).openvpn.version }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.prepare.outputs.variants) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Record build timestamp
        id: build-time
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=${{ matrix.variant.tag_prefix }}
          annotations: |
            org.opencontainers.image.title=OpenVPN ${{ env.OPENVPN_VERSION }} (${{ matrix.variant.name }})
            org.opencontainers.image.description=OpenVPN ${{ env.OPENVPN_VERSION }} with OVPNLogin authentication support using the ${{ matrix.variant.name }} target.
            org.opencontainers.image.authors=Paul Christophel <pmartin@gatech.edu>
            org.opencontainers.image.vendor=Paul Christophel
            org.opencontainers.image.source=https://github.com/PaulChristophel/OVPNLogin
            org.opencontainers.image.url=https://hub.docker.com/r/pcm0/openvpn
            org.opencontainers.image.documentation=https://github.com/PaulChristophel/OVPNLogin#readme
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.build-time.outputs.created }}
            org.opencontainers.image.version=${{ env.OPENVPN_VERSION }}
            org.opencontainers.image.component.openvpn.version=${{ env.OPENVPN_VERSION }}
            edu.gatech.image.owner=Paul Christophel <pmartin@gatech.edu>
            edu.gatech.image.repository=${{ env.IMAGE_NAME }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.variant.target }}
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          build-args: |
            GOLANG_IMAGE=${{ fromJSON(needs.prepare.outputs.configuration).build.golang_image }}
            K8S_IMAGE=${{ fromJSON(needs.prepare.outputs.configuration).build.k8s_image }}
            ALPINE_IMAGE=${{ fromJSON(needs.prepare.outputs.configuration).build.alpine_image }}
            OPENVPN_VERSION=${{ env.OPENVPN_VERSION }}
            OPENVPN_SHA512=${{ fromJSON(needs.prepare.outputs.configuration).openvpn.sha512 }}
          cache-from: type=gha,scope=openvpn-${{ matrix.variant.name }}
          cache-to: type=gha,mode=max,scope=openvpn-${{ matrix.variant.name }}

      - name: Generate provenance attestation
        uses: actions/attest@v4
        with:
          subject-name: index.docker.io/pcm0/openvpn
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
