{{- if .Values.rbac.create -}}
{{- $roleName := default (printf "%s-service-reader" (include "openvpn-router.fullname" .)) .Values.rbac.serviceReader.nameOverride -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $roleName }}
  labels:
    {{- include "openvpn-router.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      {{- toYaml .Values.rbac.serviceReader.verbs | nindent 6 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $roleName }}
  labels:
    {{- include "openvpn-router.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $roleName }}
subjects:
  - kind: ServiceAccount
    name: {{ include "openvpn-router.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
