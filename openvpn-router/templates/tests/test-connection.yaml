apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "openvpn-router.fullname" . }}-test-connection"
  labels:
    {{- include "openvpn-router.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: nc
      image: busybox
      command:
        - sh
        - -c
      args:
        - nc -vz {{ include "openvpn-router.fullname" . }} {{ .Values.service.ports.tcp.port }}
  restartPolicy: Never
